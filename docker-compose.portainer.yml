# Portainer Stack - CORTEX Voice Recorder
# Deploy this stack in Portainer using the web editor

services:
  cortex:
    image: yourbr0ther/cortex:latest
    container_name: cortex
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent data storage for notes
      - cortex_data:/data
    environment:
      # API key for nano-gpt.com transcription enhancement
      - NANO_GPT_API_KEY=${NANO_GPT_API_KEY:-}
      - NANO_GPT_API_URL=https://nano-gpt.com/api/v1/chat/completions
      # Whisper model: tiny, base, small, medium, large
      # base is a good balance of speed and accuracy
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - DATA_DIR=/data
      # Timezone for timestamps
      - TIMEZONE=${TIMEZONE:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/folders"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  cortex_data:
    driver: local

networks:
  default:
    name: cortex-network
